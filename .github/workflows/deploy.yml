name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Copy project files to VPS
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_DIR }}

      - name: Extract n8n data volumes in VPS
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd ${{ secrets.DEPLOY_DIR }}

          # Create docker volumes
          docker volume create n8n_data_1
          docker volume create n8n_data_2
          docker volume create n8n_data_3

          # Restore data to volumes
          docker run --rm -v n8n_data_1:/volume -v $(pwd)/vps-deploy:/backup alpine sh -c "cd /volume && tar xzvf /backup/n8n_data_1.tar.gz"
          docker run --rm -v n8n_data_2:/volume -v $(pwd)/vps-deploy:/backup alpine sh -c "cd /volume && tar xzvf /backup/n8n_data_2.tar.gz"
          docker run --rm -v n8n_data_3:/volume -v $(pwd)/vps-deploy:/backup alpine sh -c "cd /volume && tar xzvf /backup/n8n_data_3.tar.gz"
          EOF

      - name: Start services in VPS
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd ${{ secrets.DEPLOY_DIR }}
          docker compose pull
          docker compose up -d --force-recreate
          EOF
